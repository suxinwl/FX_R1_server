name: Build and publish R1 MediaServer

on:
  push:
    branches: [main]
    paths:
      - "services/r1-media-server/**"
      - ".github/workflows/publish-r1-media.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/r1-media-server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fx-r1-media-server:1.2.3
            ghcr.io/${{ github.repository_owner }}/fx-r1-media-server:latest
